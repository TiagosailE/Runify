# Datas, horas, números e helpers de view do Rails em português. Espelha as
# chaves que actionview/activesupport/activemodel definem em inglês; o teste
# test/integration/locale_completeness_test.rb falha se faltar alguma. Os
# ordinais (number.nth) são lambdas e ficam em rails.pt-BR.rb.
pt-BR:
  date:
    abbr_day_names: [dom, seg, ter, qua, qui, sex, sáb]
    abbr_month_names: [~, jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    formats:
      default: "%d/%m/%Y"
      long: "%d de %B de %Y"
      short: "%d de %B"
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    order:
      - :day
      - :month
      - :year
  datetime:
    distance_in_words:
      about_x_hours:
        one: "cerca de 1 hora"
        other: "cerca de %{count} horas"
      about_x_months:
        one: "cerca de 1 mês"
        other: "cerca de %{count} meses"
      about_x_years:
        one: "cerca de 1 ano"
        other: "cerca de %{count} anos"
      almost_x_years:
        one: "quase 1 ano"
        other: "quase %{count} anos"
      half_a_minute: "meio minuto"
      less_than_x_minutes:
        one: "menos de um minuto"
        other: "menos de %{count} minutos"
      less_than_x_seconds:
        one: "menos de 1 segundo"
        other: "menos de %{count} segundos"
      over_x_years:
        one: "mais de 1 ano"
        other: "mais de %{count} anos"
      x_days:
        one: "1 dia"
        other: "%{count} dias"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      x_months:
        one: "1 mês"
        other: "%{count} meses"
      x_seconds:
        one: "1 segundo"
        other: "%{count} segundos"
    prompts:
      day: "Dia"
      hour: "Hora"
      minute: "Minuto"
      month: "Mês"
      second: "Segundo"
      year: "Ano"
    relative:
      future: "em %{time}"
      past: "há %{time}"
  errors:
    messages:
      password_too_long: "é muito longa"
  flash:
    actions:
      create:
        notice: "%{resource_name} foi criado(a) com sucesso."
      destroy:
        alert: "%{resource_name} não pôde ser excluído(a)."
        notice: "%{resource_name} foi excluído(a) com sucesso."
      update:
        notice: "%{resource_name} foi atualizado(a) com sucesso."
  helpers:
    select:
      prompt: "Selecione"
    submit:
      create: "Criar %{model}"
      submit: "Salvar %{model}"
      update: "Atualizar %{model}"
  number:
    currency:
      format:
        delimiter: "."
        format: "%u %n"
        negative_format: "-%u %n"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: "R$"
    format:
      delimiter: "."
      precision: 3
      round_mode: default
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion:
            one: "bilhão"
            other: "bilhões"
          million:
            one: "milhão"
            other: "milhões"
          quadrillion:
            one: "quatrilhão"
            other: "quatrilhões"
          thousand: "mil"
          trillion:
            one: "trilhão"
            other: "trilhões"
          unit: ""
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "Byte"
            other: "Bytes"
          eb: "EB"
          gb: "GB"
          kb: "KB"
          mb: "MB"
          pb: "PB"
          tb: "TB"
          zb: "ZB"
    percentage:
      format:
        delimiter: "."
        format: "%n%"
    precision:
      format:
        delimiter: "."
  support:
    array:
      last_word_connector: " e "
      two_words_connector: " e "
      words_connector: ", "
  time:
    am: ""
    formats:
      default: "%a, %d de %B de %Y, %H:%M:%S %z"
      long: "%d de %B de %Y, %H:%M"
      short: "%d de %B, %H:%M"
    pm: ""
