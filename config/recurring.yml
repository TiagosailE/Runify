production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Migrados de config/schedule.rb (whenever) — mesmos horarios.
  workout_reminder:
    class: WorkoutReminderJob
    schedule: "0 8 * * *"
  daily_notifications:
    class: DailyNotificationsJob
    schedule: "0 19 * * *"
  weekly_summary:
    class: WeeklySummaryJob
    schedule: "0 18 * * 0"
